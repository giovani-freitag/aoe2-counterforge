name: Release

on:
    push:
        branches: [main]
    # Publishing the current main without cutting a release.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            released: ${{ steps.release-please.outputs.release_created }}
        steps:
            # A pull request opened with the workflow token holds its checks until someone approves
            # them, and they expire as failures. A token of its own lets CI run on the release pull
            # request like on any other; the workflow token is only the fallback until it is set.
            - uses: googleapis/release-please-action@v4
              id: release-please
              with:
                  release-type: node
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

    # The site is built here, in the run that cut the release, rather than in a workflow listening
    # for one: a release cut with the workflow token raises no event of its own.
    deploy:
        needs: release
        if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.pages.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - uses: actions/deploy-pages@v4
              id: pages
