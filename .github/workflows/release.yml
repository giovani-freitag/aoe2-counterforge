name: Release

on:
    push:
        branches: [main]
    # Publishing the current main without cutting a release.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            released: ${{ steps.release-please.outputs.release_created }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release-please
              with:
                  release-type: node

    # A release created with the workflow token raises no event of its own, so the site is built
    # here rather than in a workflow listening for one.
    deploy:
        needs: release
        if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.pages.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - uses: actions/deploy-pages@v4
              id: pages
